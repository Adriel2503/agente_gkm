services:
  autobot:
    build:
      context: .
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      - autobot_logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  autobot_logs:
